<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Una Flor de Regalo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="flores-jardin" class="jardin" aria-label="Jardín interactivo">
    <div class="jardin-cabecera">
      <p class="jardin-guia">Pulsa una flor de color para ver su postal.</p>
      <p class="cita-portada">«Hay flores que cuentan historias que las palabras no alcanzan a contar.»</p>
    </div>
    <div class="jardin-escena">
      <img id="jardin-estatico" src="jardin.png" alt="" width="1080" height="610">
      <canvas id="flores" aria-hidden="true"></canvas>
      <a class="flor-enlace" data-flor-enlace="rosa" href="#postal-rosa" aria-label="Ver la postal de la flor rosa" hidden></a>
      <a class="flor-enlace" data-flor-enlace="naranja" href="#postal-naranja" aria-label="Ver la postal de la flor naranja" hidden></a>
      <a class="flor-enlace" data-flor-enlace="verde" href="#postal-verde" aria-label="Ver la postal de la flor verde" hidden></a>
      <a class="flor-enlace" data-flor-enlace="azul" href="#postal-azul" aria-label="Ver la postal de la flor azul" hidden></a>
    </div>
  </section>
  <header class="portada">
    <h1>Una Flor de Regalo</h1>
    <nav class="portada-navegacion" aria-label="Explorar el proyecto">
      <a class="portada-enlace portada-enlace--flores" href="#flores-jardin">Flores</a>
      <a class="portada-enlace" href="#historias">Historias</a>
    </nav>
  </header>
  <main id="historias">
    <section class="dedicatoria" id="postal-rosa" aria-labelledby="titulo-rosa" style="--flor-color: #a44c79">
      <h2 id="titulo-rosa">Flor rosa</h2>
      <button type="button" class="postal-giro" data-postal-giro aria-pressed="false" aria-label="Voltear la postal" aria-describedby="foto-rosa">
        <span class="postal-giro-interior">
          <span class="postal-cara postal-anverso" id="foto-rosa">Foto de la persona</span>
          <span class="postal-cara postal-reverso" id="dedicatoria-rosa" aria-hidden="true">Dedicatoria pendiente</span>
        </span>
      </button>
      <a class="dedicatoria-volver" href="#flores-jardin">Volver al jardín</a>
    </section>
    <section class="dedicatoria" id="postal-naranja" aria-labelledby="titulo-naranja" style="--flor-color: #a16339">
      <h2 id="titulo-naranja">Flor naranja</h2>
      <button type="button" class="postal-giro" data-postal-giro aria-pressed="false" aria-label="Voltear la postal" aria-describedby="foto-naranja">
        <span class="postal-giro-interior">
          <span class="postal-cara postal-anverso" id="foto-naranja">Foto de la persona</span>
          <span class="postal-cara postal-reverso" id="dedicatoria-naranja" aria-hidden="true">Dedicatoria pendiente</span>
        </span>
      </button>
      <a class="dedicatoria-volver" href="#flores-jardin">Volver al jardín</a>
    </section>
    <section class="dedicatoria" id="postal-verde" aria-labelledby="titulo-verde" style="--flor-color: #487a68">
      <h2 id="titulo-verde">Flor verde</h2>
      <button type="button" class="postal-giro" data-postal-giro aria-pressed="false" aria-label="Voltear la postal" aria-describedby="foto-verde">
        <span class="postal-giro-interior">
          <span class="postal-cara postal-anverso" id="foto-verde">Foto de la persona</span>
          <span class="postal-cara postal-reverso" id="dedicatoria-verde" aria-hidden="true">Dedicatoria pendiente</span>
        </span>
      </button>
      <a class="dedicatoria-volver" href="#flores-jardin">Volver al jardín</a>
    </section>
    <section class="dedicatoria" id="postal-azul" aria-labelledby="titulo-azul" style="--flor-color: #8fb3e2">
      <h2 id="titulo-azul">Flor azul</h2>
      <button type="button" class="postal-giro" data-postal-giro aria-pressed="false" aria-label="Voltear la postal" aria-describedby="foto-azul">
        <span class="postal-giro-interior">
          <span class="postal-cara postal-anverso" id="foto-azul">Foto de la persona</span>
          <span class="postal-cara postal-reverso" id="dedicatoria-azul" aria-hidden="true">Dedicatoria pendiente</span>
        </span>
      </button>
      <a class="dedicatoria-volver" href="#flores-jardin">Volver al jardín</a>
    </section>
  </main>

  <!-- El JavaScript va al final, cuando la página ya está cargada -->
  <script src="script.js"></script>
</body>
</html>
